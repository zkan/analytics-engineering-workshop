name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install the project
        run: uv sync --locked
      - name: Unit tests
        run: uv run --locked pytest
      - name: Generate clean data
        run: uv run --locked python -m jaidee_mart.generate --seed 42 --scale teaching --clean
      - name: dbt deps
        working-directory: jaidee
        run: uv run --locked dbt deps
      - name: dbt build
        working-directory: jaidee
        run: uv run --locked dbt build
